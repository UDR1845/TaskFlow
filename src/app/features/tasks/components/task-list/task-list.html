<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="fw-bold mb-0">Listado de actividades</h5>

  <span class="badge text-bg-light">
    {{ tasks.length }} tareas
  </span>
</div>

@if (tasks.length > 0) {

  <div class="row g-3">

    @for (task of tasks; track task.id) {

      <div class="col-12">
        <app-task-item
          [task]="task"
          (edit)="edit.emit($event)"
          (delete)="delete.emit($event)"
          (toggle)="toggle.emit($event)">
        </app-task-item>
      </div>

    }

  </div>

} @else {

  <div class="empty-state text-center py-5">
    <i class="bi bi-clipboard-check display-3 text-secondary"></i>

    <h5 class="fw-bold mt-3">No hay tareas disponibles</h5>

    <p class="text-muted mb-0">
      No encontramos actividades con los filtros seleccionados.
    </p>
  </div>

}
