<div class="card task-card border-0 shadow-sm">
  <div class="card-body">

    <div class="d-flex align-items-start gap-3">

      <input
        class="form-check-input mt-1"
        type="checkbox"
        [checked]="task.completed"
        (change)="toggle.emit(task.id)">

      <div class="flex-grow-1">

        <div class="d-flex justify-content-between flex-wrap gap-2">

          <div>
            <h6 class="fw-bold mb-2"
                [class.text-decoration-line-through]="task.completed"
                [class.text-muted]="task.completed">
              {{ task.title }}
            </h6>

            <p class="text-muted small mb-2">
              {{ task.description || 'Sin descripción' }}
            </p>
          </div>

          <span class="badge rounded-pill" [class]="priorityClass">
            {{ task.priority }}
          </span>

        </div>

        <div class="d-flex flex-wrap gap-3 align-items-center mt-2">

          <span class="small text-muted">
            <i class="bi bi-calendar3 me-1"></i>
            Creada: {{ task.createdAt | date:'dd/MM/yyyy' }}
          </span>

          @if (task.dueDate) {
            <span
              class="small"
              [class.text-danger]="isOverdue"
              [class.text-success]="!isOverdue && !task.completed"
              [class.text-muted]="task.completed">

              <i class="bi bi-calendar-event me-1"></i>
              Límite: {{ task.dueDate | date:'dd/MM/yyyy':'UTC' }}

              @if (isOverdue) {
                <span class="badge bg-danger ms-1">Vencida</span>
              }

              @if (task.completed) {
                <span class="badge bg-success ms-1">Completada</span>
              }
            </span>
          }

          <div class="d-flex gap-2 ms-auto">

            <button
              class="btn btn-sm btn-outline-primary"
              title="Editar"
              (click)="edit.emit(task)">
              <i class="bi bi-pencil"></i>
            </button>

            <button
              class="btn btn-sm btn-outline-danger"
              title="Eliminar"
              (click)="delete.emit(task.id)">
              <i class="bi bi-trash"></i>
            </button>

          </div>

        </div>

      </div>
    </div>
  </div>
</div>
